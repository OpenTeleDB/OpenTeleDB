
# 服务相关配置
daemonize no
unix_socket_dir "/tmp"
unix_socket_mode "0644"
locks_dir "/tmp/odyssey"
use_unix_socket_if_possible yes
graceful_die_on_errors no
enable_online_restart no
bindwith_reuseport no
pid_file "/tmp/odyssey.pid"
# 日志相关的配置
log_file "./xproxy.log"
log_format "%p %t %l [%i %s] (%c) %m\n"
log_to_stdout no
log_syslog no
log_syslog_ident "xproxy"
log_syslog_facility "daemon"
log_debug no
log_config yes
log_session yes
log_query no
log_stats no
log_general_stats_prom no
log_route_stats_prom no
stats_interval 60
# 性能相关配置
workers 4
resolvers 1
readahead 8192
cache_coroutine 100112
coroutine_stack_size 4
nodelay yes
keepalive 15
keepalive_keep_interval 5
keepalive_probes 3
keepalive_usr_timeout 0
# 全局限制
client_max 200000
server_login_retry 1
# 监听端口配置
# 可以同时监听多个端口

listen {
    host "*"
    port 6001
    backlog 4096
    compression no
    port_attrs "Read-write"
}

listen {
    host "*"
    port 6002
    backlog 4096
    compression no
    port_attrs "Write-only"
}

listen {
    host "*"
    port 6003
    backlog 4096
    compression no
    port_attrs "Read-only"
}

# 存储节点配置
storage "openteledb_server" {
    type "remote"
    # 配置数据库服务器的地址以及权重
    endpoints {
        endpoint
        {
            hostname "127.0.0.1"
            port 5432
            weight 0.0
            application_name ""
        }
    	endpoint
        {
            hostname "127.0.0.1"
            port 5433
            weight 10.0
	        application_name "127.0.0.1:5433"
        } 
    }
    target_session_attrs "read-write"
    watchdog {
        storage "openteledb_server"
        storage_db "postgres"
        storage_user "your_user"
        storage_password "your_password"
        pool_routing "internal"
        pool "transaction"
        pool_size 10
        pool_timeout 0
        pool_ttl 0
        log_debug no
        replication_delay_threshold 0
        catchup_timeout 15
    }
}
# 数据库和用户配置
database default {
    # 专门用于登录认证的“内部”用户，并不存在于数据库
    user "user_aq_internal_pooling" {
            authentication "none"
            storage "openteledb_server"
            pool "session"
            storage_db "postgres"
            storage_user "your_user"
            storage_password "your_password"
            log_debug no
            log_query no
            pool_size 10
            pool_timeout 10000
            pool_routing "internal"
            enable_quantiles_state yes
	        catchup_timeout 4
    }
    user default {
            authentication "scram-sha-256"
            allow_clear_text_frontend_auth no
            auth_query "SELECT usename, passwd FROM pg_shadow WHERE usename=$1"
            auth_query_db "openteledb"
            auth_query_user "user_aq_internal_pooling"
            target_server_attrs "auto"
            client_max 100000
            storage "openteledb_server"
            pool "transaction"
            pool_size 112
            pool_timeout 0
            pool_ttl 1800
            pool_cancel yes
            pool_rollback yes
            pool_idle_in_transaction_timeout 0
            pool_reserve_prepared_statement yes
            pool_prepared_statement_limit 500
            pool_prepared_statement_expired_time 120
            client_fwd_error yes
            server_lifetime 3600
            application_name_add_host yes
            reserve_session_server_connection no
            log_debug no
            enable_quantiles_state yes
            replication_delay_threshold 30000000
            catchup_timeout 5
            enable_read_only_blacklist yes 
    }
}
 
# 管控数据库和用户名配置
storage "local" {
        type "local"
}
database "console" {
        user default {
                authentication "scram-sha-256"
                auth_query "SELECT usename, passwd FROM pg_shadow WHERE usename=$1"
                auth_query_db "openteledb"
                auth_query_user "user_aq_internal_pooling"
                role "admin"
                pool "session"
                storage "local"
                quantiles "0.95,0.5"
        }
}

